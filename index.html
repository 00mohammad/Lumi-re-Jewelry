<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumière Jewelry</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>

    <header>

      <section>

        <div class="header-container">

          <!-- Menu -->
          <img class="menu-icon" src="./assets/icons/menu.svg" alt="Menu">

          <!-- Logo -->
          <div class="logo">
            <img class="logo-icon" src="./assets/icons/logo.svg" alt="Logo">
            <h1>Sun</h1>
          </div>

          <!-- Navigation -->
          <nav>
            <ul>
              <li><a href="#">Ring</a></li>
              <li><a href="#">Bracelet</a></li>
              <li><a href="#">Necklaces</a></li>
              <li><a href="#">Earrings</a></li>
            </ul>
          </nav>

          <!-- Actions -->
          <div class="header-actions">
            <img class="search-icon" src="./assets/icons/search.svg"
              alt="Search">
            <img class="shopping-icon" src="./assets/icons/shopping_bag.svg"
              alt="Shopping bag">
            <img class="profile-icon" src="./assets/images/Ellipse 280.png"
              alt="Profile">
          </div>

        </div>

      </section>

    </header>

    <script src="./js/script.js"></script>
  </body>
</html>
