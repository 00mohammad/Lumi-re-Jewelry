<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumière Jewelry</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>

    <header>

      <section>

        <div class="header-container">

          <!-- Menu -->

          <img class="menu-icon" src="./assets/icons/menu.svg" alt="Menu">

          <!-- Logo -->

          <div class="logo">
            <img class="logo-icon" src="./assets/icons/logo.svg" alt="Logo">
            <h1>Sun</h1>
          </div>

          <!-- Navigation -->

          <nav>
            <ul>
              <li><a href="#">Ring</a></li>
              <li><a href="#">Bracelet</a></li>
              <li><a href="#">Necklaces</a></li>
              <li><a href="#">Earrings</a></li>
            </ul>
          </nav>

          <!-- Actions -->

          <div class="header-actions">
            <img class="search-icon" src="./assets/icons/search.svg"
              alt="Search">
            <img class="shopping-icon" src="./assets/icons/shopping_bag.svg"
              alt="Shopping bag">
            <img class="profile-icon" src="./assets/images/Ellipse 280.png"
              alt="Profile">
          </div>

        </div>
        <section class="hero">
          <div class="header-bottom">

            <div class="hero-content">

              <h2 class="hero-title">
                Discover
                <span class="hero-word">
                  the
                  <span class="hero-oval"></span>
                </span>
              </h2>

              <h2 class="hero-title">
                best jewelry
              </h2>

              <h2 class="hero-title">
                in the world
              </h2>

              <p>
                Exquisite adornments for every occasion,
                Crafted with precision and passion.
                Elegance and glamour in every design,
                Indulge in luxury, make every moment sublime.
              </p>

              <img
                class="asset-image"
                src="./assets/images/Asset.png"
                alt="Jewelry" />

            </div>

            <div class="hero-image">
              <img
                src="./assets/images/headerimg.png"
                alt="Jewelry collection" />

            </div>

          </div>
          <img
            class="hero-secondary-image"
            src="./assets/images/headerimg.png"
            alt="Jewelry collection" />
        </section>

      </header>

      <script src="./js/script.js"></script>
    </body>
  </html>
